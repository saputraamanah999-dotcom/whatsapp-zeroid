name: Deploy Firebase Rules

# Rules Firestore/Storage + index otomatis TER-UPDATE setiap kali ada push yang
# mengubah file rules. Sekali pasang secret FIREBASE_SERVICE_ACCOUNT, lalu lupakan.
#
# Cara pasang secret (sekali saja):
#  1. Firebase Console → ⚙️ Project settings → Service accounts →
#     "Generate new private key" → unduh file JSON.
#  2. GitHub repo → Settings → Secrets and variables → Actions →
#     "New repository secret" → Name: FIREBASE_SERVICE_ACCOUNT
#     → Secret: tempel SELURUH isi file JSON tadi.

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firestore.indexes.json'
      - '.github/workflows/deploy-rules.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy rules via Rules API (tanpa firebase-tools — cukup izin firebaserules)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/ci-deploy-rules.mjs
