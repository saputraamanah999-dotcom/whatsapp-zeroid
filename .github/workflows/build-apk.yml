name: Build APK Zeroid

# APK RESMI — gratis via GitHub Actions (runner punya Android SDK).
# Cara pakai: tab Actions → "Build APK Zeroid" → Run workflow → tunggu ±15-25 menit
# → unduh artefak "zeroid-apk" di bawah run → instal di HP (izinkan sumber tak dikenal).
#
# Keystore dari secrets (konsisten antar build — update APK tanpa uninstall).
# google-services.json (FCM push) ikut dari repo — token FCM native aktif di APK.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.json'
      - 'google-services.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "⚠️ Keystore secret kosong — build unsigned"; exit 0; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > zeroid-release.keystore

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      - name: Copy keystore + inject signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: |
          if [ -f zeroid-release.keystore ]; then
            cp zeroid-release.keystore android/app/zeroid-release.keystore
            node scripts/patch-android-signing.mjs
          else
            echo "⚠️ Tanpa keystore — APK release pakai debug signing"
          fi

      - name: Build APK (assembleRelease)
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Siapkan artefak
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/release/*.apk apk-out/ 2>/dev/null || cp android/app/build/outputs/apk/debug/*.apk apk-out/
          ls -la apk-out/
          VERSION=$(node -p "require('./app.json').expo.version")
          for f in apk-out/*.apk; do mv "$f" "apk-out/zeroid-${VERSION}.apk"; done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: zeroid-apk
          path: apk-out/*.apk
          retention-days: 30
