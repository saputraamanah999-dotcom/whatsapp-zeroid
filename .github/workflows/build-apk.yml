name: Build APK Zeroid

# APK RESMI — gratis via GitHub Actions (runner punya Android SDK).
# Cara pakai: tab Actions → "Build APK Zeroid" → Run workflow → tunggu ±15-25 menit
# → unduh artefak "zeroid-apk" di bawah run → instal di HP (izinkan sumber tak dikenal).
#
# Keystore dari secrets (konsisten antar build — update APK tanpa uninstall).
# google-services.json (FCM push) ikut dari repo — token FCM native aktif di APK.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.json'
      - 'google-services.json'
      - 'package.json'
      - 'package-lock.json'
      - 'plugins/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "⚠️ Keystore secret kosong — build unsigned"; exit 0; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > zeroid-release.keystore

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      # ENV PUBLIK APLIKASI (EXPO_PUBLIC_*) — dibutuhkan saat bundling JS: tanpa ini
      # APK tampil "configuration required". Nilainya PUBLIC (identik dengan bundle
      # web Vercel) — disimpan base64 di secret ZEROID_WEB_ENV. Kunci SERVER
      # (Jerexd/ImgBB/Sylvatica/service account) TIDAK PERNAH masuk APK.
      - name: Tulis .env (EXPO_PUBLIC_* publik)
        env:
          ZEROID_WEB_ENV: ${{ secrets.ZEROID_WEB_ENV }}
        run: |
          if [ -z "$ZEROID_WEB_ENV" ]; then echo "⚠️ secret ZEROID_WEB_ENV kosong"; else echo "$ZEROID_WEB_ENV" | base64 -d > .env; echo "env ditulis: $(wc -l < .env) baris"; fi

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      - name: Sinkronkan minify & shrink (Expo SDK 57 template mismatch)
        run: |
          sed -i 's/^android.enableShrinkResourcesInReleaseBuilds=.*/android.enableShrinkResourcesInReleaseBuilds=true/' android/gradle.properties
          grep -q '^android.enableMinifyInReleaseBuilds=' android/gradle.properties \
            || echo 'android.enableMinifyInReleaseBuilds=true' >> android/gradle.properties
          sed -i 's/^android.enableMinifyInReleaseBuilds=.*/android.enableMinifyInReleaseBuilds=true/' android/gradle.properties
          grep -E 'enable(Minify|ShrinkResources)InReleaseBuilds' android/gradle.properties

      - name: Copy keystore + inject signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: |
          if [ -f zeroid-release.keystore ]; then
            cp zeroid-release.keystore android/app/zeroid-release.keystore
            node scripts/patch-android-signing.mjs
          else
            echo "⚠️ Tanpa keystore — APK release pakai debug signing"
          fi

      - name: Build APK (assembleRelease)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Siapkan artefak
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/release/*.apk apk-out/ 2>/dev/null || cp android/app/build/outputs/apk/debug/*.apk apk-out/
          ls -la apk-out/
          VERSION=$(node -p "require('./app.json').expo.version")
          for f in apk-out/*.apk; do mv "$f" "apk-out/zeroid-${VERSION}.apk"; done
          cp apk-out/zeroid-${VERSION}.apk apk-out/zeroid-apk-latest.apk
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: zeroid-apk
          path: apk-out/*.apk
          retention-days: 30

      # TERBITKAN ke GitHub Releases → tautan unduh PUBLIK tanpa login:
      # https://github.com/saputraamanah999-dotcom/whatsapp-zeroid/releases/download/apk-latest/zeroid-apk-latest.apk
      # Halaman /apk.html di website memakai tautan tetap ini.
      - name: Terbitkan ke GitHub Releases (unduh publik)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          gh release view apk-latest >/dev/null 2>&1 \
            || gh release create apk-latest --title "Zeroid APK $VERSION" --notes "APK resmi Zeroid WhatsApp v$VERSION — unduh via https://whatsapp-zeroid.vercel.app/apk.html" --latest
          gh release upload apk-latest apk-out/zeroid-apk-latest.apk --clobber
          gh release edit apk-latest --title "Zeroid APK $VERSION" --latest
          echo "Release apk-latest diperbarui: zeroid-apk-latest.apk (v$VERSION)"
