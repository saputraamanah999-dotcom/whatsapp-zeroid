name: Deploy Web ke Vercel

# VERCEL WEB — build otomatis berjalan lewat Git Integration Vercel
# (project linked ke repo ini). Workflow ini MEMANTAU deployment commit
# terbaru lewat Vercel API (token team-scoped — CLI tidak dipakai):
#   READY    → job sukses
#   ERROR    → job gagal + alasan error build tampil di log Actions
# Jadi setiap push: Vercel build → Actions melapor hasilnya.
#
# Token: repo secret VERCEL_TOKEN (Project Access Token, team-scoped).

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_API: https://api.vercel.com

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Cek token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "↷ secret VERCEL_TOKEN belum dipasang — pemantauan dilewati."
            echo "MONITOR=0" >> "$GITHUB_ENV"
          else
            echo "✅ VERCEL_TOKEN ada — pantau deployment Vercel."
            echo "MONITOR=1" >> "$GITHUB_ENV"
          fi

      - name: Tunggu deployment commit ini (maks 12 menit)
        if: env.MONITOR == '1'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          PROJ="prj_6OYo8RNMp2SK5RPjqzsgNg1SG4q7"
          AUTH="Authorization: Bearer $VERCEL_TOKEN"
          echo "Menunggu deployment untuk commit ${SHA:0:7}…"
          DEP=""
          for i in $(seq 1 24); do
            R=$(curl -s -H "$AUTH" "$VERCEL_API/v6/deployments?projectId=$PROJ&limit=8&target=production")
            DEP=$(echo "$R" | python3 -c "
import json,sys
sha='$SHA'.lower()
for x in json.load(sys.stdin).get('deployments',[]):
    if (x.get('meta') or {}).get('githubCommitSha','').lower()==sha:
        print(x['uid']); break
")
            [ -n "$DEP" ] && break
            sleep 30
          done
          if [ -z "$DEP" ]; then echo "⚠️ Deployment untuk commit ini tidak ditemukan (mungkin commit tanpa perubahan web)."; exit 0; fi
          echo "Deployment: $DEP — tunggu hasil build…"
          STATE=""
          for i in $(seq 1 24); do
            STATE=$(curl -s -H "$AUTH" "$VERCEL_API/v13/deployments/$DEP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('readyState',''))")
            echo "  [$i] $STATE"
            case "$STATE" in
              READY) echo "✅ WEB LIVE — deployment READY"; exit 0 ;;
              ERROR|CANCELED)
                MSG=$(curl -s -H "$AUTH" "$VERCEL_API/v13/deployments/$DEP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('errorMessage') or d.get('errorCode') or 'tanpa pesan')")
                echo "##[error]Build Vercel GAGAL: $MSG"; exit 1 ;;
            esac
            sleep 30
          done
          echo "##[error]Timeout menunggu deployment selesai."; exit 1
