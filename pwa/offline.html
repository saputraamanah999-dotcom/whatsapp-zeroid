<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Zeroid WhatsApp — Offline</title>
<meta name="theme-color" content="#1E6BFF" />
<link rel="icon" href="/favicon-32.png" />
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #E9EDF3; color: #1B2433; text-align: center; padding: 24px;
  }
  .card {
    max-width: 420px; background: #EEF1F6; border-radius: 24px; padding: 40px 28px;
    box-shadow: 8px 8px 18px rgba(163,177,198,.7), -8px -8px 18px rgba(255,255,255,.95);
  }
  .logo { width: 84px; height: 84px; border-radius: 24px; background: #1E6BFF; display: grid; place-items: center; margin: 0 auto 20px; }
  .logo span { color: #fff; font-size: 40px; font-weight: 800; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #5F6B7D; font-size: 14px; line-height: 1.6; margin: 0 0 22px; }
  button {
    border: 0; background: #1E6BFF; color: #fff; font-weight: 700; font-size: 15px;
    padding: 14px 28px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 10px 22px rgba(30,107,255,.38);
  }
  button:active { transform: scale(.97); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><span>Z</span></div>
    <h1>Kamu sedang offline</h1>
    <p>Zeroid WhatsApp membutuhkan koneksi internet untuk chat realtime, panggilan, dan notifikasi. Periksa jaringanmu lalu coba lagi.</p>
    <button onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
